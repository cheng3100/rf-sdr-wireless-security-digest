site_name: RF / SDR / Wireless Hack Digest
site_description: SDR、wireless hack 开源项目与 RF 原理技术情报库
site_url: https://cheng3100.github.io/rf-sdr-wireless-security-digest/
repo_url: https://github.com/cheng3100/rf-sdr-wireless-security-digest
repo_name: cheng3100/rf-sdr-wireless-security-digest

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Weekly:
      - 归档索引: weekly/index.md
      - 2026-08-01 · 精简版测试: weekly/2026-08-01.md
      - 2026-07-31 · 第 1 期: weekly/2026-07-31.md
  - 软件项目: software-projects/index.md
  - 软硬件项目: hardware-software-projects/index.md
  - RF 原理精读: rf-sdr-fundamentals/index.md
