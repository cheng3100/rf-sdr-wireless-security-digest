site_name: RF / SDR / Wireless Security Digest
site_description: RF、SDR 与无线安全研究技术情报库
site_url: https://cheng3100.github.io/rf-sdr-wireless-security-digest/
repo_url: https://github.com/cheng3100/rf-sdr-wireless-security-digest
repo_name: cheng3100/rf-sdr-wireless-security-digest

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 每周简报:
      - 索引: weekly/index.md
      - 2026-07-31 · 第 1 期: weekly/2026-07-31.md
  - 软件型开源项目: software-projects/index.md
  - 软硬件一体项目: hardware-software-projects/index.md
  - 无线安全研究: wireless-security/index.md
  - RF / SDR 原理: rf-sdr-fundamentals/index.md
  - 协议逆向: protocol-reversing/index.md
  - 实践实验: experiments/index.md
  - 编写规范: contributing.md
