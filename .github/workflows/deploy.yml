name: Deploy Jekyll Hacker site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Add front matter to Markdown pages
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            first_line=$(head -n 1 "$file" || true)
            if [ "$first_line" != "---" ]; then
              tmp=$(mktemp)
              printf '%s\n%s\n%s\n' '---' 'layout: default' '---' > "$tmp"
              cat "$file" >> "$tmp"
              mv "$tmp" "$file"
            fi
          done < <(find docs -type f -name '*.md' -print0)

      - name: Build Jekyll site
        run: bundle exec jekyll build --source docs --destination site --baseurl "/rf-sdr-wireless-security-digest"
        env:
          JEKYLL_ENV: production

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
